<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>全新岚图知音 · 3D 交互展示</title>
  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f6f8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app { position: absolute; inset: 0; }
    canvas { display: block; }

    /* ---------- 加载层 ---------- */
    #loader { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #ffffff 0%, #eef0f4 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity .6s; }
    #loader.hide { opacity: 0; pointer-events: none; }
    #loader .title { color: #1a2233; font-size: 28px; letter-spacing: 6px; margin-bottom: 8px; }
    #loader .sub { color: #98a1b3; font-size: 13px; letter-spacing: 2px; margin-bottom: 32px; }
    #loader .bar-wrap { width: 260px; height: 3px; background: #dde1e8; border-radius: 2px; overflow: hidden; }
    #loader .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2b5ce6, #4f8cff); transition: width .3s; }
    #loader .pct { color: #4f8cff; font-size: 12px; margin-top: 10px; font-variant-numeric: tabular-nums; }

    /* ---------- 顶部标题 ---------- */
    #title-bar { position: absolute; top: 0; left: 0; right: 0; padding: 22px 28px; display: flex; align-items: baseline; gap: 14px; z-index: 10; pointer-events: none; background: linear-gradient(#ffffffe6, transparent); }
    #title-bar .brand { color: #1a2233; font-size: 20px; font-weight: 600; letter-spacing: 3px; }
    #title-bar .model { color: #8b93a4; font-size: 13px; letter-spacing: 1px; }

    /* ---------- 底部控制面板 ---------- */
    #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #ffffffd9 40%, #ffffffee); }
    .section { margin-bottom: 12px; }
    .section:last-child { margin-bottom: 0; }
    .section-title { color: #9aa3b2; font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: #1a223310; }

    /* 颜色选择 */
    .colors { display: flex; gap: 10px; flex-wrap: wrap; }
    .color-chip { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; position: relative; border: 2px solid #ffffff; box-shadow: 0 1px 4px #1a223322; transition: transform .15s, border-color .2s, box-shadow .2s; }
    .color-chip:hover { transform: scale(1.12); }
    .color-chip.active { border-color: #2b5ce6; box-shadow: 0 0 0 2px #2b5ce633, 0 2px 8px #1a223322; }
    .color-chip .name { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); color: #6b7686; font-size: 10px; white-space: nowrap; opacity: 0; transition: opacity .15s; pointer-events: none; }
    .color-chip:hover .name, .color-chip.active .name { opacity: 1; }

    /* 功能按钮 */
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; border-radius: 18px; border: 1px solid #d8dde5; background: #ffffff; color: #3d4655; font-size: 12px; cursor: pointer; transition: all .18s; box-shadow: 0 1px 3px #1a223310; white-space: nowrap; }
    .btn:hover { border-color: #b9c2d0; color: #1a2233; }
    .btn.on { background: linear-gradient(90deg, #2b5ce6, #4f8cff); border-color: transparent; color: #fff; box-shadow: 0 2px 10px #2b5ce644; }
    .btn.small { padding: 6px 10px; font-size: 11px; border-radius: 14px; }
    .btn[disabled] { opacity: .35; pointer-events: none; }

    /* 相机预设 */
    .view-btns { display: flex; gap: 8px; }
    .speed-row { display: flex; align-items: center; gap: 10px; }
    .speed-row input[type=range] { flex: 1; accent-color: #2b5ce6; height: 3px; }
    .speed-row .val { color: #2b5ce6; font-size: 12px; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

    /* toast */
    #toast { position: absolute; top: 76px; left: 50%; transform: translateX(-50%) translateY(-8px); background: #1a2233e6; color: #fff; padding: 8px 18px; border-radius: 18px; font-size: 12px; letter-spacing: 1px; opacity: 0; transition: all .3s; z-index: 50; pointer-events: none; box-shadow: 0 4px 16px #1a223333; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 提示 */
    #hint { position: absolute; right: 16px; bottom: 50%; transform: translateY(50%); color: #b6bdcb; font-size: 11px; writing-mode: vertical-rl; letter-spacing: 4px; pointer-events: none; z-index: 5; }

    @media (max-width: 640px) {
      #title-bar { padding: 16px 18px; }
      #title-bar .brand { font-size: 17px; }
      .color-chip { width: 32px; height: 32px; }
      .btn { padding: 7px 11px; font-size: 11px; }
      #panel { overflow-y: auto; max-height: 46%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="title">岚图知音</div>
    <div class="sub">VOYAH ZHIYIN · 3D CONFIGURATOR</div>
    <div class="bar-wrap"><div class="bar" id="load-bar"></div></div>
    <div class="pct" id="load-pct">0%</div>
  </div>

  <div id="title-bar">
    <span class="brand">全新岚图知音</span>
    <span class="model">超空间华系纯电SUV · 4810×1900×1636mm · three.js 重制版</span>
  </div>

  <div id="toast"></div>
  <div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>

  <div id="panel">
    <div class="section">
      <div class="section-title">外观颜色</div>
      <div class="colors" id="colors"></div>
    </div>
    <div class="section">
      <div class="section-title">车门 / 车窗 / 后备箱</div>
      <div class="btns" id="doors"></div>
    </div>
    <div class="section">
      <div class="section-title">灯光 / 行驶</div>
      <div class="btns" id="drive"></div>
    </div>
    <div class="section">
      <div class="section-title">视角</div>
      <div class="view-btns" id="views"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
