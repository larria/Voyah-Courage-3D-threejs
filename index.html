  <style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;margin:0;padding:0}html,body{background:#f5f6f8;width:100%;height:100%;font-family:PingFang SC,Microsoft YaHei,sans-serif;overflow:hidden}#app{position:absolute;inset:0}canvas{display:block}#loader{z-index:100;background:radial-gradient(#fff 0%,#eef0f4 70%);flex-direction:column;justify-content:center;align-items:center;transition:opacity .6s;display:flex;position:absolute;inset:0}#loader.hide{opacity:0;pointer-events:none}#loader .title{color:#1a2233;letter-spacing:6px;margin-bottom:8px;font-size:28px}#loader .sub{color:#98a1b3;letter-spacing:2px;margin-bottom:32px;font-size:13px}#loader .bar-wrap{background:#dde1e8;border-radius:2px;width:260px;height:3px;overflow:hidden}#loader .bar{background:linear-gradient(90deg,#2b5ce6,#4f8cff);width:0%;height:100%;transition:width .3s}#loader .pct{color:#4f8cff;font-variant-numeric:tabular-nums;margin-top:10px;font-size:12px}#title-bar{z-index:10;pointer-events:none;background:linear-gradient(#ffffffe6,#0000);align-items:baseline;gap:14px;padding:22px 28px;display:flex;position:absolute;top:0;left:0;right:0}#title-bar .brand{color:#1a2233;letter-spacing:3px;font-size:20px;font-weight:600}#title-bar .model{color:#8b93a4;letter-spacing:1px;font-size:13px}#panel{z-index:10;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#ffffffd9 40%,#fffe);position:absolute;bottom:0;left:0;right:0}.section{margin-bottom:12px}.section:last-child{margin-bottom:0}.section-title{color:#9aa3b2;letter-spacing:2px;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;display:flex}.section-title:after{content:"";background:#1a223310;flex:1;height:1px}.colors{flex-wrap:wrap;gap:10px;display:flex}.color-chip{cursor:pointer;border:2px solid #fff;border-radius:50%;width:38px;height:38px;transition:transform .15s,border-color .2s,box-shadow .2s;position:relative;box-shadow:0 1px 4px #1a223322}.color-chip:hover{transform:scale(1.12)}.color-chip.active{border-color:#2b5ce6;box-shadow:0 0 0 2px #2b5ce633,0 2px 8px #1a223322}.color-chip .name{color:#6b7686;white-space:nowrap;opacity:0;pointer-events:none;font-size:10px;transition:opacity .15s;position:absolute;top:44px;left:50%;transform:translate(-50%)}.color-chip:hover .name,.color-chip.active .name{opacity:1}.btns{flex-wrap:wrap;gap:8px;display:flex}.btn{color:#3d4655;cursor:pointer;white-space:nowrap;background:#fff;border:1px solid #d8dde5;border-radius:18px;padding:8px 14px;font-size:12px;transition:all .18s;box-shadow:0 1px 3px #1a223310}.btn:hover{color:#1a2233;border-color:#b9c2d0}.btn.on{color:#fff;background:linear-gradient(90deg,#2b5ce6,#4f8cff);border-color:#0000;box-shadow:0 2px 10px #2b5ce644}.btn.small{border-radius:14px;padding:6px 10px;font-size:11px}.btn[disabled]{opacity:.35;pointer-events:none}.view-btns{gap:8px;display:flex}.speed-row{align-items:center;gap:10px;display:flex}.speed-row input[type=range]{accent-color:#2b5ce6;flex:1;height:3px}.speed-row .val{color:#2b5ce6;text-align:right;font-variant-numeric:tabular-nums;min-width:52px;font-size:12px}#toast{color:#fff;letter-spacing:1px;opacity:0;z-index:50;pointer-events:none;background:#1a2233e6;border-radius:18px;padding:8px 18px;font-size:12px;transition:all .3s;position:absolute;top:76px;left:50%;transform:translate(-50%)translateY(-8px);box-shadow:0 4px 16px #1a223333}#toast.show{opacity:1;transform:translate(-50%)translateY(0)}#hint{color:#b6bdcb;writing-mode:vertical-rl;letter-spacing:4px;pointer-events:none;z-index:5;font-size:11px;position:absolute;bottom:50%;right:16px;transform:translateY(50%)}@media (width<=640px){#title-bar{padding:16px 18px}#title-bar .brand{font-size:17px}.color-chip{width:32px;height:32px}.btn{padding:7px 11px;font-size:11px}#panel{max-height:46%;overflow-y:auto}}</style>

</head>
<body>
  <div id="app"></div>

  <div id="loader">
    <div class="title">岚图知音</div>
    <div class="sub">VOYAH ZHIYIN · 3D CONFIGURATOR</div>
    <div class="bar-wrap"><div class="bar" id="load-bar"></div></div>

      <div class="btns" id="drive"></div>
    </div>
    <div class="section">
      <div class="section-title">视角</div>
      <div class="view-btns" id="views"></div>
    </div>
  </div>
